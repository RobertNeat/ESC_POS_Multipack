<p-toast position="bottom-right" />
<header class="topbar">
  <a class="brand" routerLink="/" [attr.aria-label]="'app.brandHome' | t">
    <span class="brand-mark"><i class="pi pi-print"></i></span>
    <span
      ><strong>{{ 'app.brand' | t }}</strong
      ><small>{{ 'app.model' | t }}</small></span
    >
  </a>
  <nav [attr.aria-label]="'app.mainNavigation' | t">
    @for (item of navigation; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
      >
        <i [class]="item.icon"></i><span>{{ item.labelKey | t }}</span>
      </a>
    }
  </nav>
  <div class="topbar-actions">
    <button
      class="icon-button"
      type="button"
      (click)="theme.toggleTheme()"
      [attr.aria-label]="
        (theme.theme() === 'dark' ? 'app.enableLightTheme' : 'app.enableDarkTheme') | t
      "
      [attr.aria-pressed]="theme.theme() === 'dark'"
      [pTooltip]="(theme.theme() === 'dark' ? 'app.enableLightTheme' : 'app.enableDarkTheme') | t"
    >
      <i [class]="theme.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>
    <button
      class="encoding-button"
      type="button"
      (click)="encodingPanel.toggle($event)"
      [pTooltip]="'app.textEncoding' | t"
    >
      <i class="pi pi-cog"></i><span>{{ selectedEncodingLabel() }}</span>
    </button>
    <p-popover #encodingPanel>
      <div class="encoding-panel">
        <strong>{{ 'app.textEncoding' | t }}</strong>
        <small>{{ 'app.encodingHelp' | t }}</small>
        @for (encoding of textEncodings(); track encoding.value) {
          <button
            type="button"
            [class.selected]="api.textEncoding() === encoding.value"
            (click)="selectTextEncoding(encoding.value); encodingPanel.hide()"
          >
            <i
              [class]="
                api.textEncoding() === encoding.value ? 'pi pi-check-circle' : 'pi pi-circle'
              "
            ></i>
            <span
              ><b>{{ encoding.label }}</b
              ><small>{{ encoding.printerPage }}</small></span
            >
          </button>
        }
      </div>
    </p-popover>
    <button
      class="encoding-button"
      type="button"
      (click)="languagePanel.toggle($event)"
      [pTooltip]="'app.language' | t"
    >
      <i class="pi pi-language"></i><span>{{ i18n.language().toUpperCase() }}</span>
    </button>
    <p-popover #languagePanel>
      <div class="encoding-panel">
        <strong>{{ 'app.language' | t }}</strong>
        <button
          type="button"
          [class.selected]="i18n.language() === 'pl'"
          (click)="setLanguage('pl'); languagePanel.hide()"
        >
          <i [class]="i18n.language() === 'pl' ? 'pi pi-check-circle' : 'pi pi-circle'"></i
          ><span
            ><b>{{ 'app.polish' | t }}</b></span
          >
        </button>
        <button
          type="button"
          [class.selected]="i18n.language() === 'en'"
          (click)="setLanguage('en'); languagePanel.hide()"
        >
          <i [class]="i18n.language() === 'en' ? 'pi pi-check-circle' : 'pi pi-circle'"></i
          ><span
            ><b>{{ 'app.english' | t }}</b></span
          >
        </button>
      </div>
    </p-popover>
    <button
      class="connection-pill"
      type="button"
      routerLink="/"
      [pTooltip]="'app.checkConnection' | t"
    >
      <span class="status-dot" [class.online]="api.connectionState() === 'online'"></span>
      {{
        api.connectionState() === 'online'
          ? ('app.printerOnline' | t)
          : api.connectionState() === 'checking'
            ? ('app.checking' | t)
            : ('app.noConnection' | t)
      }}
    </button>
  </div>
</header>
<main class="app-content"><router-outlet /></main>
